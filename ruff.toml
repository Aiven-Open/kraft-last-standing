fix = true
target-version = "py312"

[lint]
extend-select = [
  # bugbear
  "B",
  # comprehensions
  "C4",
  # mccabe
  "C90",
  # bandit
  "S",
  # blind exception
  # Bare excepts are caught without this, but this also catches `except Exception: ...`.
  "BLE",
  # builtins
  "A",
  # Enforce valid noqa comments.
  "RUF100",
  # isort
  "I",
  # pycodestyle
  "W",
  # pyupgrade
  "UP",
  # debugger
  "T10",
  # print
  "T20",
  # quotes
  "Q",
  # simplify
  "SIM",
  # tidy imports
  # We use this to only outlaw relative _parent_ imports, other relative imports are OK.
  "TID",
]
extend-ignore = [
  # There's no reason to outlaw asserts.
  # https://stackoverflow.com/a/68429294/1220706
  "S101",
  # Ignore line-length. This is enforced by the formatter, but all cases cannot be
  # handled.
  "E501",
  # Bad advice, builtin syntax is simpler than imports.
  "SIM105",
]

[lint.isort]
lines-between-types = 1
force-single-line = true
known-first-party = ["kraft_last_standing", "tests"]

[lint.mccabe]
max-complexity = 10

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.extend-per-file-ignores]
"src/kraft_last_standing/cli.py" = [
  # The command line interface communicates with its user through stdout.
  "T201",
]
"tests/*" = [
  # Tests drive docker and Kafka tooling through subprocesses with trusted input.
  "S603",
  "S607",
]
