# No caching: directories restored from the GitHub Actions cache have been missing files.

on:
  workflow_call: {}

env:
  COLUMNS: "120"
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

jobs:
  goose-run:
    name: Run goose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
      - run: pip install --upgrade git-goose
      - run: goose run --select=all
      - run: git diff
