name: Publish documentation

# Versioned documentation is built with mike and committed to the gh-pages branch, which
# GitHub Pages serves. The main branch is published as "dev", and each release as its
# major.minor version, which also takes the "latest" alias unless it's a pre-release. The
# site root redirects to "latest", or to "dev" until there is a release.

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # mike needs the gh-pages branch and the tags.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs-requirements.txt
          check-latest: true
      - run: pip install --require-hashes -r docs-requirements.txt
      # mike commits to the gh-pages branch, which requires an author. Commit as the
      # github-actions[bot] account, whose name and email are the same in every
      # repository. GitHub attributes a commit to an account by its
      # ID+USERNAME@users.noreply.github.com address, and 41898282 is the public ID of
      # the bot, as in the actions/checkout example of pushing a commit.
      # https://docs.github.com/en/account-and-profile/reference/email-addresses-reference#your-noreply-email-address
      # https://github.com/actions/checkout/blob/f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a/README.md?plain=1#L343-L345
      # https://api.github.com/users/github-actions%5Bbot%5D
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish development version
        if: github.event_name != 'release'
        run: |
          mike deploy --push --update-aliases dev
          if ! mike list --json | jq --exit-status 'any(.[]; .aliases | index("latest"))'; then
            mike set-default --push dev
          fi
      - name: Publish release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(cut -d. -f1-2 <<< "$TAG")"
          if [[ "$PRERELEASE" == "true" ]]; then
            mike deploy --push "$version"
          else
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          fi
