name: CI
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  COLUMNS: "120"
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Static analysis
    uses: antonagestam/goose/.github/workflows/run.yaml@0.14.2

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: typing-requirements.txt
          check-latest: true
      - name: mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: "${{ runner.os }}-mypy-3.14-${{ hashFiles('typing-requirements.txt') }}"
          restore-keys: |
            ${{ runner.os }}-mypy-3.14
            ${{ runner.os }}-mypy
      - run: pip install --require-hashes -r typing-requirements.txt
      - run: pip install --no-deps -e .
      - run: mypy

  check-build:
    name: Check packaging metadata
    uses: less-action/reusables/.github/workflows/python-test-build.yaml@main

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15-dev"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
          check-latest: true
      - run: pip install -e '.[test]'
      - run: coverage run -m pytest
      - run: |
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          coverage report

  integration-test:
    name: Integration test (Kafka ${{ matrix.kafka-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka-version: ["4.3.1"]
    env:
      KAFKA_VERSION: ${{ matrix.kafka-version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
          check-latest: true
      - run: pip install -e '.[test]'
      - name: Pull image
        run: docker pull --quiet "apache/kafka:$KAFKA_VERSION"
      - run: pytest -m integration

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs-requirements.txt
          check-latest: true
      - run: pip install --require-hashes -r docs-requirements.txt
      - run: mkdocs build --strict
